name: Apply responsive portrait teaser layout

on:
  push:
    branches:
      - responsive-portrait-teasers
      - main

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          start_marker = "  /* ---------- HOCHFORMAT: Bild oben"
          end_marker = "\n\n</style>"

          start = html.index(start_marker)
          end = html.index(end_marker, start)

          new_css = r"""  /* ---------- HOCHFORMAT: dynamisches Layout nach tatsächlichem Seitenverhältnis ---------- */
          @media (orientation:portrait){
            .news-teaser{
              display:grid;
              grid-template-columns:1fr;
              grid-template-rows:var(--teaser-image-share) var(--teaser-text-share);
              height:var(--teaser-height);
              min-height:var(--teaser-height);
            }
            .news-teaser-image{
              grid-row:1;
              grid-column:1;
              width:100%;
              height:auto;
              min-height:0;
              flex:none;
            }
            .news-teaser-text{
              position:static;
              grid-row:2;
              grid-column:1;
              min-height:0;
              height:auto;
              padding:20px 30px;
              background:transparent;
              display:flex;
              flex-direction:column;
              justify-content:center;
              gap:0;
            }
            .news-teaser-text h2{
              position:absolute;
              left:30px;
              bottom:calc(var(--teaser-text-share) + 18px);
              z-index:3;
              margin:0;
              color:var(--white);
              font-size:2rem;
              text-shadow:0 2px 8px rgba(0,0,0,.45);
              pointer-events:none;
            }
            .news-teaser-text p{
              margin:0;
              max-width:none;
              color:var(--ink-900);
              font-size:1rem;
              line-height:1.6;
            }
            .lupe-btn{
              position:absolute;
              right:16px;
              bottom:calc(var(--teaser-text-share) + 16px);
              z-index:4;
              width:54px;
              height:54px;
              flex:none;
              border:none;
              border-radius:50%;
              background:rgba(255,255,255,.3);
              box-shadow:var(--shadow-soft);
            }
            .lupe-btn:hover{
              background:var(--yellow-400);
              transform:scale(1.06);
            }
          }

          /* Hochformat auf schmalen Geräten: kompaktere Innenabstände, die
             Geometrie bleibt vollständig an das Seitenverhältnis gekoppelt. */
          @media (orientation:portrait) and (max-width:720px){
            .news-teaser-text{padding:16px 20px;}
            .news-teaser-text h2{
              left:20px;
              bottom:calc(var(--teaser-text-share) + 14px);
              font-size:1.55rem;
            }
            .lupe-btn{
              right:16px;
              bottom:calc(var(--teaser-text-share) + 12px);
            }
          }

          /* Die Werte werden per JS anhand des tatsächlichen CSS-Viewport-
             Seitenverhältnisses zwischen zwei definierten Endpunkten
             interpoliert. */
          :root{
            --teaser-height:40vh;
            --teaser-image-share:70%;
            --teaser-text-share:30%;
          }
          """

          html = html[:start] + new_css + html[end:]

          script = r"""
<script>
(() => {
  const MIN_RATIO = 1280 / 2772; // Xiaomi 15T: 0.4618...
  const MAX_RATIO = 3 / 4;       // iPad 4:3 im Hochformat

  const MIN_HEIGHT_VH = 40;
  const MAX_HEIGHT_VH = 46;
  const MIN_IMAGE_SHARE = 70;
  const MAX_IMAGE_SHARE = 80;

  let rafId = 0;

  function updatePortraitTeaserLayout() {
    rafId = 0;

    const viewport = window.visualViewport;
    const width = viewport ? viewport.width : window.innerWidth;
    const height = viewport ? viewport.height : window.innerHeight;

    if (!height) return;

    const ratio = width / height;
    const factor = Math.max(
      0,
      Math.min(1, (ratio - MIN_RATIO) / (MAX_RATIO - MIN_RATIO))
    );

    const teaserHeight = MIN_HEIGHT_VH +
      (MAX_HEIGHT_VH - MIN_HEIGHT_VH) * factor;

    const imageShare = MIN_IMAGE_SHARE +
      (MAX_IMAGE_SHARE - MIN_IMAGE_SHARE) * factor;

    const textShare = 100 - imageShare;

    document.documentElement.style.setProperty(
      '--teaser-height',
      teaserHeight.toFixed(3) + 'vh'
    );
    document.documentElement.style.setProperty(
      '--teaser-image-share',
      imageShare.toFixed(3) + '%'
    );
    document.documentElement.style.setProperty(
      '--teaser-text-share',
      textShare.toFixed(3) + '%'
    );
  }

  function scheduleUpdate() {
    if (rafId) return;
    rafId = requestAnimationFrame(updatePortraitTeaserLayout);
  }

  window.addEventListener('resize', scheduleUpdate, { passive: true });
  window.addEventListener('orientationchange', scheduleUpdate, { passive: true });

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scheduleUpdate, { passive: true });
  }

  updatePortraitTeaserLayout();
})();
</script>
"""

          body_marker = "</body>"
          if html.count(body_marker) != 1:
              raise RuntimeError("Expected exactly one </body> marker.")

          html = html.replace(body_marker, script + "\n" + body_marker, 1)
          path.write_text(html, encoding="utf-8")

      - name: Commit patch, remove temporary files, and redeploy Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f .github/workflows/apply-responsive-portrait-teasers.yml .portrait-teaser-trigger || true
          git add index.html
          git commit -m "Responsive portrait teaser layout"
          git push

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -f ref=main
